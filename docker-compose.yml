version: "3.9"

services:
  # =========================
  # Base de données PostgreSQL
  # =========================
  smartschool-db:
    image: postgres:15-alpine
    container_name: smartschool-db-${APP_ENV}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - /mnt/data/AppData/smartschool/${APP_ENV}/db:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smartschool-network

  # =========================
  # Redis (Cache & Queues)
  # =========================
  smartschool-redis:
    image: redis:7-alpine
    container_name: smartschool-redis-${APP_ENV}
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - /mnt/data/AppData/smartschool/${APP_ENV}/redis:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartschool-network

  # =========================
  # Backend NestJS
  # =========================
  smartschool-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartschool-api-${APP_ENV}
    restart: always
    # Sécurité : Exécution en tant qu'utilisateur non-root (défini dans Dockerfile)
    security_opt:
      - no-new-privileges:true
    # Système de fichiers en lecture seule (sauf volumes montés)
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@smartschool-db:5432/${DB_NAME}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: ${BACKEND_PORT}
      NODE_ENV: ${NODE_ENV}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      # Stockage persistant des uploads
      - /mnt/data/AppData/smartschool/${APP_ENV}/backend/uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    depends_on:
      smartschool-db:
        condition: service_healthy
    healthcheck:
      # Test simple si l'API répond (nécessite curl ou wget dans l'image, ou node script)
      # Comme on utilise node-slim, curl n'est pas forcément là. On utilise node.
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:3010/api/health', (res) => { if (res.statusCode !== 200) process.exit(1); })\" || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - smartschool-network

  # =========================
  # Frontend Vite / Nginx
  # =========================
  smartschool-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartschool-ui-${APP_ENV}
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    ports:
      # Nginx (Unprivileged) écoute sur 8080, on mappe le port externe UI_PORT dessus
      - "${UI_PORT}:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    depends_on:
      smartschool-api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - smartschool-network

  # =========================
  # Frontend Support (Interface de support technique)
  # =========================
  smartschool-support:
    build:
      context: ./frontend-support
      dockerfile: Dockerfile
    container_name: smartschool-support-${APP_ENV}
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    ports:
      # Nginx (Unprivileged) écoute sur 8080, on mappe le port SUPPORT_PORT dessus
      - "${SUPPORT_PORT:-3004}:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    depends_on:
      smartschool-api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - smartschool-network

# =========================
# Réseau commun
# =========================
networks:
  smartschool-network:
    driver: bridge
