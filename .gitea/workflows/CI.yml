name: CI SmartSchool
on: [push]

jobs:
  backend:
    runs-on: ubuntu-latest  # Runner sur ZimaBoard s'en occupera
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install  # C'est cette ligne qui manquait sûrement !

      - name: Build
        run: npm run build